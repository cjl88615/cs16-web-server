// LAN-only browser game. Generated hostname and BOT settings load last.
sv_lan 1
sv_cheats 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 1
mp_freezetime 3
mp_roundtime 3
mp_buytime 0.5
mp_startmoney 800
mp_timelimit 25
pausable 0
// Conserve CPU/network bandwidth on a two-core LAN VM.
sv_maxrate 30000
sv_minrate 5000
sv_maxupdaterate 66
sv_minupdaterate 20
exec lan-game.cfg
