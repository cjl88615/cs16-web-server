// Taliabu CS 1.6 LAN server. Restrict access using host firewall and Docker port binding.
hostname "Taliabu CS 1.6 LAN"
sv_lan 0
public 0
sv_cheats 0
mp_timelimit 25
mp_roundtime 3
mp_freezetime 3
mp_buytime 1.5
mp_startmoney 800
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 1

// YaPB standalone (bots are server-side).
// With fill mode quota=8 means a target of 8 humans + bots, not 8 extra bots.
yb_language "chs"
yb_quota "8"
yb_quota_mode "fill"
yb_autovacate "1"
yb_autovacate_keep_slots "1"
yb_skill "55"
yb_kick_after_player_connect "1"
