# Copy .env.example to .env and set LAN_IP to the VM's real address.
services:
  cs16-web-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs16-lan
    restart: unless-stopped
    platform: linux/386
    command: ["+map", "de_dust2", "+maxplayers", "12"]
    environment:
      IP: "${LAN_IP:?Set LAN_IP in .env}"
      PORT: "27018"
    ports:
      - "${LAN_IP:?Set LAN_IP in .env}:27016:27016/tcp"
      - "${LAN_IP:?Set LAN_IP in .env}:27018:27018/udp"
    volumes:
      - yapb-data:/xashds/cstrike/addons/yapb/data

volumes:
  yapb-data:
