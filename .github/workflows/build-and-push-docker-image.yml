# The finished Docker image includes game resources. Never publish it to a public registry.
name: Frontend checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Bundle
        run: npm run build
