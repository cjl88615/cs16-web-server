name: Build Docker (manual, publish opt-in)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish game-containing image only if redistribution rights are established'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/cs16-web-server:${{ github.sha }}
