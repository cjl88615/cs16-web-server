name: One-time upgrade formatting
on:
  push:
    branches: ['upgrade/20261107-cn-bots']
    paths: ['.github/workflows/format-upgrade.yml']
permissions:
  contents: read
jobs:
  format:
    if: github.ref == 'refs/heads/upgrade/20261107-cn-bots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/20261107-cn-bots
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical formatting only
        run: |
          gofmt -w src/server/*.go
          node -e "const fs=require('fs');const p='package-lock.json';fs.writeFileSync(p,JSON.stringify(JSON.parse(fs.readFileSync(p)),null,2)+'\n')"
          git add src/server package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: canonical Go and lockfile formatting'
          git push origin HEAD:upgrade/20261107-cn-bots
